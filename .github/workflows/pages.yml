# Publish the site, not the repo. Pages used to serve every tracked file, so internal
# docs (*.md), scripts, tests, and agent config were public URLs on the domain.
# Deny-list, not allow-list: a new site asset can never be left out by mistake.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the public site folder
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '_site' --exclude '.git' --exclude '.github' --exclude '.claude' \
            --exclude '.agents' --exclude '.githooks' --exclude '.gitignore' \
            --exclude 'scripts' --exclude 'tests' --exclude 'hogware-worker' \
            --exclude 'requirements.txt' --exclude '*.md' --exclude '*-template.html'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
