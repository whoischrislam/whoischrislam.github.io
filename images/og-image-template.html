<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      background: #FBF8F4;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 96px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle top border stripe */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: #D4512B;
    }

    .name {
      font-size: 100px;
      font-weight: 700;
      color: #1A1A18;
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 24px;
    }

    .title {
      font-size: 38px;
      font-weight: 500;
      color: #D4512B;
      letter-spacing: -0.5px;
      margin-bottom: 36px;
    }

    .tagline {
      font-size: 26px;
      color: #6A675F;
      line-height: 1.45;
      max-width: 820px;
    }

    .url {
      position: absolute;
      bottom: 60px;
      left: 96px;
      font-size: 22px;
      color: #9A988F;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div class="name">Chris Lam</div>
  <div class="title">Product engineer &amp; designer</div>
  <div class="tagline">Designs it, builds it, and ships it, with no handoff. 14 years across healthcare and consumer software. Now building voice AI at y30.</div>
  <div class="url">whoischrislam.github.io</div>
</body>
</html>
