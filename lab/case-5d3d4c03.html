<style>

.gridL{position:relative;isolation:isolate}
.gridL::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
 background-image:linear-gradient(var(--g1) 1px,transparent 1px),linear-gradient(90deg,var(--g1) 1px,transparent 1px),linear-gradient(var(--g2) 1px,transparent 1px),linear-gradient(90deg,var(--g2) 1px,transparent 1px);
 background-size:12px 12px,12px 12px,48px 48px,48px 48px;background-position:center center}
.gridL.frame::before{-webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 55%,transparent 55%,#000 100%);mask-image:radial-gradient(ellipse 62% 58% at 50% 55%,transparent 55%,#000 100%)}
.dots{background-image:radial-gradient(circle,var(--gd) 1.1px,transparent 1.5px);background-size:12px 12px}

.hbg{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}

.hbg.major{background-image:linear-gradient(var(--g1) 1px,transparent 1px),linear-gradient(90deg,var(--g1) 1px,transparent 1px);background-size:96px 96px;background-position:center top}

@media (max-width:760px){.chx.split,.chx.stacked{grid-template-columns:1fr;gap:14px}.chx.split .chp{padding-top:0}.chh{font-size:28px}section[style*="padding:120px 0 88px"]{padding:64px 0 56px!important}}
/* TRAILER: header */

.back{font-size:15px;font-weight:600;margin-bottom:28px;opacity:.85}.kick{font-size:15px;opacity:.78;margin-bottom:12px}

.row{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:48px;margin-top:48px;align-items:start}
.po .lab{margin-bottom:6px}.po .val{font:400 21px/1.45 var(--serif);color:var(--ink)}.po>div+div{margin-top:28px}
.lab{font-weight:700;font-size:16px}.val{color:var(--soft);font-size:16px;line-height:1.45}

.ch h2{font:400 34px/1.15 var(--serif);margin:0 0 14px}.ch p{max-width:700px;font-size:19px}
/* seams */
.seam{display:block;width:100%;height:32px}
/* T3 showcase: stage */
.stage{background:var(--stage);color:#f2f0ea;padding:56px 0 64px}
.stage .cap{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 18px}.stage .cap h3{font:400 30px/1.2 var(--serif);margin:0}.stage .cap span{font-size:15px;opacity:.75}
.stage img{display:block;width:100%;height:auto;border:1px solid rgba(255,255,255,.25)}
.play{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:15px;padding:10px 16px;background:var(--band);color:var(--bink);margin-top:18px}
/* T2 breakout: result */
.brk{background:var(--band);color:var(--bink);padding:72px 0}
.brk .k{font-size:15px;font-weight:600;opacity:.8;margin-bottom:6px}.brk h3{font:400 38px/1.15 var(--serif);margin:0 0 26px;max-width:760px}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cell{border:1px solid var(--ink);padding:20px;background:var(--card);color:var(--ink)}
.cell .n{font:600 40px/1 var(--sans);margin-bottom:10px}.cell .t{font-weight:700;font-size:16px}.cell .s{color:var(--soft);font-size:15px}
.cell{transition:transform .14s steps(2),box-shadow .14s steps(2)}.cell:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--ink)}
.brk .big{font:400 30px/1.35 var(--serif);max-width:860px}
.ph{border:1px dashed var(--line);height:240px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px}.ph h4{font:400 28px/1.1 var(--serif);margin:0 0 4px}.ph p{color:var(--soft);font-size:15px}
#sw{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:#111;color:#fff;font:13px/1 system-ui;padding:6px;border-radius:6px;display:flex;gap:8px;align-items:flex-start;max-width:min(560px,calc(100vw - 32px))}#sw .gs{display:flex;flex-direction:column;gap:5px}#sw .g{display:flex;flex-wrap:wrap;gap:4px;align-items:center}#sw .g span{width:92px;flex:none}#sw.shut .gs{display:none}#sw .tog{background:#444}
#sw button{font:inherit;color:#fff;background:#333;border:0;padding:6px 8px;border-radius:4px;cursor:pointer}#sw button.on{background:#2a9d4b}#sw span{opacity:.6}
@media (max-width:760px){.wrap{padding:0 16px}.row,.ch{grid-template-columns:1fr;gap:20px}.ch{gap:6px;padding:36px 0}.head{padding-bottom:120px}.heroW{margin-top:-90px}.brk h3{font-size:30px}}
</style></head><body>
